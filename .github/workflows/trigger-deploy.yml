name: Trigger Linked Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify private deployment repository
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          DEPLOY_TARGET_REPO: ${{ secrets.DEPLOY_TARGET_REPO }}
        run: |
          if [ -z "$DEPLOY_DISPATCH_TOKEN" ] || [ -z "$DEPLOY_TARGET_REPO" ]; then
            echo "Deploy dispatch secrets are not configured; skipping."
            exit 0
          fi

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOY_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOY_TARGET_REPO}/dispatches" \
            -d "{\"event_type\":\"hakonushi_pub_updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"

          echo "Deployment dispatch sent."
